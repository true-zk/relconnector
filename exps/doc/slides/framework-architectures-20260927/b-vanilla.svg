ds</text><path d="M18,81 A72.5,8 0 0 1 163,81 L163,142 A72.5,8 0 0 1 18,142 Z" fill="#EEF4FA" stroke="#365F85" stroke-width="1.2"/><ellipse cx="90.5" cy="81" rx="72.5" ry="8" fill="#EEF4FA" stroke="#365F85" stroke-width="1.2"/><text x="90.5" y="108.56" font-family="Arial, Liberation Sans, sans-serif" font-size="18" font-weight="700" fill="#263746" text-anchor="middle">Relational DB</text><text x="90.5" y="140.8" font-family="Arial, Liberation Sans, sans-serif" font-size="15" font-weight="400" fill="#81909C" text-anchor="middle">tables + catalog</text><path d="M18,343 A72.5,8 0 0 1 163,343 L163,405 A72.5,8 0 0 1 18,405 Z" fill="#EEF4FA" stroke="#365F85" stroke-width="1.2"/><ellipse cx="90.5" cy="343" rx="72.5" ry="8" fill="#EEF4FA" stroke="#365F85" stroke-width="1.2"/><text x="90.5" y="370.56" font-family="Arial, Liberation Sans, sans-serif" font-size="18" font-weight="700" fill="#263746" text-anchor="middle">Task seeds</text><text x="90.5" y="403.8" font-family="Arial, Liberation Sans, sans-serif" font-size="15" font-weight="400" fill="#81909C" text-anchor="middle">IDs / times / labels</text><rect x="970" y="282" width="210" height="265" rx="7" fill="#FFFCF6" stroke="#9A692D" stroke-width="1.1" stroke-dasharray="7 5"/><text x="982" y="306.64" font-family="Arial, Liberation Sans, sans-serif" font-size="17" font-weight="700" fill="#9A692D" text-anchor="start">Trainer / GPU</text><rect x="986" y="329" width="168" height="52" rx="6" fill="#FFF2E1" stroke="#9A692D" stroke-width="1.3"/><text x="1070.0" y="355.72" font-family="Arial, Liberation Sans, sans-serif" font-size="16.0" font-weight="700" fill="#263746" text-anchor="middle">Feature enc. + GNN</text><rect x="986" y="405" width="168" height="45" rx="6" fill="#FFF2E1" stroke="#9A692D" stroke-width="1.3"/><text x="1070.0" y="433.56" font-family="Arial, Liberation Sans, sans-serif" font-size="18" font-weight="700" fill="#263746" text-anchor="middle">Loss + backward</text><rect x="986" y="477" width="168" height="45" rx=