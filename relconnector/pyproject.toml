[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relconnector"
version = "0.1.0"
description = "Replaceable SQL readers for materialized RelBench datasets"
readme = "readme.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
]

[project.optional-dependencies]
connectorx = ["connectorx>=0.4.5", "pyarrow>=14"]
relbench = ["relbench>=3.0"]
training = ["relbench[full]>=3.0,<4", "sentence-transformers>=5"]
dev = ["pyright>=1.1.400", "ruff>=0.16"]

[tool.setuptools.packages.find]
include = ["relconnector", "relconnector.*", "baseline", "baseline.*", "benchmark", "benchmark.*", "relbench_compat", "relbench_compat.*", "data", "data.*"]
namespaces = false

[tool.ruff]
line-length = 88
