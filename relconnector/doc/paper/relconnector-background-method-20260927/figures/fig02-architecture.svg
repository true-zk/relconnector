    <text style="fill: #172b45; font: 700 15px 'DejaVu Sans'; text-anchor: start" x="15.57" y="22.7232" transform="rotate(-0 15.57 22.7232)">RelConnector: separate reusable preparation from demand-driven execution</text>
   </g>
   <g id="text_2">
    <text style="fill: #172b45; font: 700 9.5px 'DejaVu Sans'; text-anchor: middle" x="74.16" y="76.349406" transform="rotate(-0 74.16 76.349406)">Relational database</text>
   </g>
